name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libgtksourceview-3.0-dev libssl-dev
          - os: macos-latest
            setup: brew install cmake ninja pkg-config gtk+3 gtksourceview3 openssl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rc3
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          path: grclib
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Configure
        run: cmake -S rc3 -B rc3/build -G Ninja -DGRCLIB_SOURCE_DIR=${{ github.workspace }}/grclib
      - name: Build
        run: cmake --build rc3/build --parallel
      - name: Test
        run: ctest --test-dir rc3/build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl3-${{ matrix.os }}
          path: rc3/bin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rc3
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          path: grclib
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk3 mingw-w64-x86_64-gtksourceview3
            mingw-w64-x86_64-openssl
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S rc3 -B rc3/build -G Ninja -DGRCLIB_SOURCE_DIR="$PWD/grclib"
          cmake --build rc3/build --parallel
          ctest --test-dir rc3/build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl3-windows
          path: rc3/bin
