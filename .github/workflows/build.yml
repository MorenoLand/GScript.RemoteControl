name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libgtksourceview-3.0-dev libssl-dev pax-utils patchelf zip
            bundle: RemoteControl-linux-x86_64
          - os: macos-latest
            setup: brew install cmake ninja pkg-config gtk+3 gtksourceview3 openssl dylibbundler
            bundle: RemoteControl-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: remotecontrol
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: grclib
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Configure
        run: cmake -S remotecontrol -B remotecontrol/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRCLIB_SOURCE_DIR=${{ github.workspace }}/grclib
      - name: Build
        run: |
          cmake --build remotecontrol/build --parallel
          strip remotecontrol/bin/RemoteControl
      - name: Test
        run: ctest --test-dir remotecontrol/build --output-on-failure
      - name: Stage Linux bundle
        if: runner.os == 'Linux'
        run: |
          bundle="${{ matrix.bundle }}"
          mkdir -p "$bundle/lib"
          grclib="$(find grclib/bin -type f -name 'grclib.so*' -print -quit)"
          test -n "$grclib"
          cp remotecontrol/bin/RemoteControl "$bundle/"
          cp "$grclib" "$bundle/lib/"
          cp -a remotecontrol/assets/runtime/fonts remotecontrol/assets/runtime/images remotecontrol/assets/runtime/language-specs remotecontrol/assets/runtime/sounds "$bundle/"
          for asset in rcicon_channelopen.png rcicon_channelclosed.png plisticononline.png rcicon_gold.png rcicon_silver.png rcicon_bronze.png rcicon_uc.png; do
            test -f "$bundle/images/$asset"
          done
          cp remotecontrol/bin/control2config.txt "$bundle/"
          sourceview="$(pkg-config --variable=libdir gtksourceview-3.0)/libgtksourceview-3.0.so.1"
          pixbuf="$(pkg-config --variable=libdir gdk-pixbuf-2.0)/gdk-pixbuf-2.0"
          test -f "$sourceview"
          cp -a "$pixbuf" "$bundle/lib/"
          { lddtree -l remotecontrol/bin/RemoteControl; lddtree -l "$grclib"; lddtree -l "$sourceview"; find "$pixbuf" -type f -name '*.so' -exec lddtree -l {} \;; } | sort -u | while read -r library; do
            [ -f "$library" ] || continue
            case "$(basename "$library")" in
              ld-linux-*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libgcc_s.so.*|libstdc++.so.*) continue ;;
            esac
            cp -n "$library" "$bundle/lib/" || true
          done
          cp -a /usr/share/glib-2.0/schemas "$bundle/share-schemas" || true
          patchelf --set-rpath '$ORIGIN/lib' "$bundle/RemoteControl"
          find "$bundle/lib" -type f -name '*.so*' -exec patchelf --set-rpath '$ORIGIN' {} +
          if find "$bundle/lib" -type f -name '*.so*' -exec sh -c 'ldd "$1" | grep -q "not found"' _ {} \; -print -quit | grep -q .; then echo "Bundled Linux dependency is unresolved."; exit 1; fi
          (cd "$bundle" && zip -r "../$bundle.zip" .)
          appDir="${bundle}.AppDir"
          mkdir -p "$appDir"
          cp -a "$bundle/." "$appDir/"
          cp remotecontrol/assets/appimage/AppRun "$appDir/"
          cp remotecontrol/assets/appimage/RemoteControl.desktop "$appDir/"
          cp "$appDir/images/rcicon.png" "$appDir/RemoteControl.png"
          chmod +x "$appDir/AppRun"
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage "$appDir" "${bundle}.AppImage"
      - name: Stage macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle="${{ matrix.bundle }}"
          app="$bundle/RemoteControl.app"
          mkdir -p "$app/Contents/MacOS/lib"
          grclib="$(find grclib/bin -type f -name 'grclib*.dylib' -print -quit)"
          test -n "$grclib"
          cp remotecontrol/bin/RemoteControl "$app/Contents/MacOS/"
          cp -a remotecontrol/assets/runtime/images remotecontrol/assets/runtime/language-specs remotecontrol/assets/runtime/sounds "$app/Contents/MacOS/"
          cp remotecontrol/bin/control2config.txt "$app/Contents/MacOS/"
          remove_bundle_rpath() {
            target="$1"
            while otool -l "$target" | grep -A2 'cmd LC_RPATH' | grep -Fq 'path @executable_path/lib/'; do
              install_name_tool -delete_rpath '@executable_path/lib/' "$target" || break
            done
          }
          remove_bundle_rpath "$app/Contents/MacOS/RemoteControl"
          dylibbundler -cd -b -x "$app/Contents/MacOS/RemoteControl" -d "$app/Contents/MacOS/lib" -p @executable_path/lib -of -s "$(dirname "$grclib")"
          remove_bundle_rpath "$app/Contents/MacOS/RemoteControl"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key><string>Remote Control</string>
              <key>CFBundleExecutable</key><string>RemoteControl</string>
              <key>CFBundleIdentifier</key><string>land.moreno.gscript.remotecontrol</string>
              <key>CFBundleName</key><string>Remote Control</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "Remote Control" -srcfolder "$bundle" -ov -format UDZO "${bundle}.dmg"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.bundle }}
          path: |
            ${{ matrix.bundle }}.zip
            ${{ matrix.bundle }}.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: remotecontrol
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: grclib
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk3 mingw-w64-x86_64-gtksourceview3
            mingw-w64-x86_64-openssl git zip
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S remotecontrol -B remotecontrol/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRCLIB_SOURCE_DIR="$PWD/grclib"
          cmake --build remotecontrol/build --parallel
          strip remotecontrol/bin/RemoteControl.exe
          ctest --test-dir remotecontrol/build --output-on-failure
          cd remotecontrol/bin
          zip -r ../../RemoteControl-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-windows-x86_64
          path: RemoteControl-windows-x86_64.zip

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.RC_RELEASES_TOKEN }}
        run: |
          build_id="$(date -u +%Y%m%d-%H%M%S)"
          for bundle in artifacts/*; do
            [ -f "$bundle" ] || continue
            sha256sum "$bundle" > "$bundle.sha256"
          done
          notes_file="$RUNNER_TEMP/remote-control-release-notes.md"
          {
            echo "# Remote Control build $build_id"
            echo
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Build type: Release (optimized, stripped)"
            echo
            echo "Checksums are included beside each package asset."
          } > "$notes_file"
          gh release create "build-$build_id" artifacts/* \
            --repo MorenoLand/GScript.RC-releases \
            --target main \
            --title "Remote Control $build_id" \
            --notes-file "$notes_file" \
            --latest
