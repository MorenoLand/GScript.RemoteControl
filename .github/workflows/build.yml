name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libgtksourceview-3.0-dev libssl-dev pax-utils patchelf zip
            bundle: RemoteControl-linux-x86_64
          - os: macos-latest
            setup: brew install cmake ninja pkg-config gtk+3 gtksourceview3 openssl dylibbundler
            bundle: RemoteControl-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: remotecontrol
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: grclib
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Configure
        run: cmake -S remotecontrol -B remotecontrol/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRCLIB_SOURCE_DIR=${{ github.workspace }}/grclib
      - name: Build
        run: |
          cmake --build remotecontrol/build --parallel
          strip remotecontrol/bin/RemoteControl
      - name: Test
        run: ctest --test-dir remotecontrol/build --output-on-failure
      - name: Stage Linux bundle
        if: runner.os == 'Linux'
        run: |
          bundle="${{ matrix.bundle }}"
          mkdir -p "$bundle/lib"
          grclib="$(find grclib/bin -type f -name 'grclib.so*' -print -quit)"
          test -n "$grclib"
          cp remotecontrol/bin/RemoteControl "$bundle/"
          cp "$grclib" "$bundle/lib/"
          cp -a remotecontrol/bin/images remotecontrol/bin/language-specs remotecontrol/bin/sounds "$bundle/"
          cp remotecontrol/bin/control2config.txt "$bundle/"
          sourceview="$(pkg-config --variable=libdir gtksourceview-3.0)/libgtksourceview-3.0.so.1"
          test -f "$sourceview"
          { lddtree -l remotecontrol/bin/RemoteControl; lddtree -l "$grclib"; lddtree -l "$sourceview"; } | sort -u | while read -r library; do
            [ -f "$library" ] || continue
            case "$(basename "$library")" in
              ld-linux-*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libgcc_s.so.*|libstdc++.so.*) continue ;;
            esac
            cp -n "$library" "$bundle/lib/" || true
          done
          cp -a /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0 "$bundle/lib/" || true
          cp -a /usr/share/glib-2.0/schemas "$bundle/share-schemas" || true
          find "$bundle" -type f \( -name 'RemoteControl' -o -name '*.so*' \) -exec patchelf --set-rpath '$ORIGIN/lib' {} +
          if find "$bundle/lib" -type f -name '*.so*' -exec sh -c 'ldd "$1" | grep -q "not found"' _ {} \; -print -quit | grep -q .; then echo "Bundled Linux dependency is unresolved."; exit 1; fi
          (cd "$bundle" && zip -r "../$bundle.zip" .)
          appDir="${bundle}.AppDir"
          mkdir -p "$appDir"
          cp -a "$bundle/." "$appDir/"
          cp remotecontrol/assets/appimage/AppRun "$appDir/"
          cp remotecontrol/assets/appimage/RemoteControl.desktop "$appDir/"
          cp "$appDir/images/rcicon.png" "$appDir/RemoteControl.png"
          chmod +x "$appDir/AppRun"
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage "$appDir" "${bundle}.AppImage"
      - name: Stage macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle="${{ matrix.bundle }}"
          mkdir -p "$bundle/lib"
          grclib="$(find grclib/bin -type f -name 'grclib*.dylib' -print -quit)"
          test -n "$grclib"
          cp remotecontrol/bin/RemoteControl "$bundle/"
          cp -a remotecontrol/bin/images remotecontrol/bin/language-specs remotecontrol/bin/sounds "$bundle/"
          cp remotecontrol/bin/control2config.txt "$bundle/"
          dylibbundler -cd -b -x "$bundle/RemoteControl" -d "$bundle/lib" -p @executable_path/lib -of -s "$(dirname "$grclib")"
          (cd "$bundle" && zip -r "../$bundle.zip" .)
          hdiutil create -volname "Remote Control" -srcfolder "$bundle" -ov -format UDZO "${bundle}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: |
            ${{ matrix.bundle }}.zip
            ${{ matrix.bundle }}.AppImage
            ${{ matrix.bundle }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: remotecontrol
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: grclib
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk3 mingw-w64-x86_64-gtksourceview3
            mingw-w64-x86_64-openssl zip
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S remotecontrol -B remotecontrol/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRCLIB_SOURCE_DIR="$PWD/grclib"
          cmake --build remotecontrol/build --parallel
          strip remotecontrol/bin/RemoteControl.exe
          ctest --test-dir remotecontrol/build --output-on-failure
          cd remotecontrol/bin
          zip -r ../../RemoteControl-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-windows-x86_64
          path: RemoteControl-windows-x86_64.zip

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.RC-releases
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: releases-repo
      - name: Publish release bundles
        run: |
          build_id="$(date -u +%Y%m%d-%H%M%S)"
          cd releases-repo
          mkdir -p "releases/$build_id"
          cp ../artifacts/* "releases/$build_id/"
          cat > "releases/$build_id/RELEASE_INFO.md" <<EOF
          # Remote Control Production Build

          ## Build Information

          - Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - Source commit: ${GITHUB_SHA}
          - Build type: Release (optimized, stripped)

          ## Packages

          Each package has a matching `.sha256` file for verification.
          EOF
          for bundle in "releases/$build_id"/*.zip "releases/$build_id"/*.AppImage "releases/$build_id"/*.dmg; do
            [ -f "$bundle" ] && sha256sum "$bundle" > "$bundle.sha256"
          done
          git rm -r --ignore-unmatch releases/latest
          mkdir -p releases/latest
          cp "releases/$build_id"/* releases/latest/
          cp ../source/LICENSE LICENSE
          printf '\n%s\n' 'The reconstructed source code is MIT licensed. Original artwork, logos, and other supplied runtime assets remain the property of their respective owners.' >> LICENSE
          {
            echo "# Remote Control - GTK3 Edition"
            echo
            echo "Automated builds of an independent GTK3 Remote Control project. It is not affiliated with Toonslab or an official client release."
            echo
            echo "Each package has a neighboring `.sha256` checksum file."
            echo
            echo "## License"
            echo
            echo "The reconstructed source code is MIT licensed. Original artwork, logos, and other supplied runtime assets remain the property of their respective owners."
          } > README.md
          git rm --ignore-unmatch hashes.md
          git config user.name "GScript RemoteControl CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE README.md releases
          git diff --cached --quiet || git commit -m "Publish Remote Control build $build_id"
          git push origin main
