name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libgtksourceview-3.0-dev libssl-dev pax-utils patchelf zip
            bundle: RemoteControl3-linux-x86_64
          - os: macos-latest
            setup: brew install cmake ninja pkg-config gtk+3 gtksourceview3 openssl dylibbundler
            bundle: RemoteControl3-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rc3
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          path: grclib
      - name: Install dependencies
        run: ${{ matrix.setup }}
      - name: Configure
        run: cmake -S rc3 -B rc3/build -G Ninja -DGRCLIB_SOURCE_DIR=${{ github.workspace }}/grclib
      - name: Build
        run: cmake --build rc3/build --parallel
      - name: Test
        run: ctest --test-dir rc3/build --output-on-failure
      - name: Stage Linux bundle
        if: runner.os == 'Linux'
        run: |
          bundle="${{ matrix.bundle }}"
          mkdir -p "$bundle/lib"
          grclib="$(find grclib/bin -type f -name 'grclib.so*' -print -quit)"
          test -n "$grclib"
          cp rc3/bin/RemoteControl3 "$bundle/"
          cp "$grclib" "$bundle/lib/"
          cp -a rc3/bin/images rc3/bin/language-specs rc3/bin/sounds "$bundle/"
          cp rc3/bin/control2config.txt "$bundle/"
          { lddtree -l rc3/bin/RemoteControl3; lddtree -l "$grclib"; } | sort -u | while read -r library; do
            case "$library" in
              /lib/*|/usr/lib/*/ld-linux-*|/usr/lib/*/libc.so.*|/usr/lib/*/libm.so.*|/usr/lib/*/libpthread.so.*|/usr/lib/*/libdl.so.*|/usr/lib/*/librt.so.*|/usr/lib/*/libgcc_s.so.*|/usr/lib/*/libstdc++.so.*) continue ;;
            esac
            cp -n "$library" "$bundle/lib/" || true
          done
          cp -a /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0 "$bundle/lib/" || true
          cp -a /usr/share/glib-2.0/schemas "$bundle/share-schemas" || true
          find "$bundle" -type f \( -name 'RemoteControl3' -o -name '*.so*' \) -exec patchelf --set-rpath '$ORIGIN/lib' {} +
          (cd "$bundle" && zip -r "../$bundle.zip" .)
          appDir="${bundle}.AppDir"
          mkdir -p "$appDir"
          cp -a "$bundle/." "$appDir/"
          cp rc3/assets/appimage/AppRun "$appDir/"
          cp rc3/assets/appimage/RemoteControl3.desktop "$appDir/"
          cp "$appDir/images/rcicon.png" "$appDir/RemoteControl3.png"
          chmod +x "$appDir/AppRun"
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage "$appDir" "${bundle}.AppImage"
      - name: Stage macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle="${{ matrix.bundle }}"
          mkdir -p "$bundle/lib"
          grclib="$(find grclib/bin -type f -name 'grclib*.dylib' -print -quit)"
          test -n "$grclib"
          cp rc3/bin/RemoteControl3 "$bundle/"
          cp -a rc3/bin/images rc3/bin/language-specs rc3/bin/sounds "$bundle/"
          cp rc3/bin/control2config.txt "$bundle/"
          dylibbundler -cd -b -x "$bundle/RemoteControl3" -d "$bundle/lib" -p @executable_path/lib -of -s "$(dirname "$grclib")"
          (cd "$bundle" && zip -r "../$bundle.zip" .)
          hdiutil create -volname "Graal Remote Control" -srcfolder "$bundle" -ov -format UDZO "${bundle}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: |
            ${{ matrix.bundle }}.zip
            ${{ matrix.bundle }}.AppImage
            ${{ matrix.bundle }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rc3
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.GRClib
          path: grclib
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk3 mingw-w64-x86_64-gtksourceview3
            mingw-w64-x86_64-openssl zip
      - name: Configure, build, and test
        shell: msys2 {0}
        run: |
          cmake -S rc3 -B rc3/build -G Ninja -DGRCLIB_SOURCE_DIR="$PWD/grclib"
          cmake --build rc3/build --parallel
          ctest --test-dir rc3/build --output-on-failure
          cd rc3/bin
          zip -r ../../RemoteControl3-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl3-windows-x86_64
          path: RemoteControl3-windows-x86_64.zip

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: MorenoLand/GScript.RC-releases
          token: ${{ secrets.RC_RELEASES_TOKEN }}
          path: releases-repo
      - name: Publish release bundles
        run: |
          build_id="$(date -u +%Y%m%d-%H%M%S)"
          cd releases-repo
          mkdir -p "releases/$build_id"
          cp ../artifacts/* "releases/$build_id/"
          git rm -r --ignore-unmatch releases/latest
          mkdir -p releases/latest
          cp "releases/$build_id"/* releases/latest/
          git config user.name "GScript RemoteControl CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git diff --cached --quiet || git commit -m "Publish RC3 build $build_id"
          git push origin main
